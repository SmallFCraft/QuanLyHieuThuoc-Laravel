e_abbad6dff4.jpg","alternativeText":null},{"url":"https://cdn.nhathuoclongchau.com.vn/v1/static/panadol_extra_1_57a4fbce39.jpg","alternativeText":"Tờ hướng dẫn sử dụng thuốc Panadol Extra đỏ GSK"},{"url":"https://cdn.nhathuoclongchau.com.vn/v1/static/panadol_extra_2_24ceca1383.jpg","alternativeText":null}],"labelImage":{"url":null,"alternativeText":null},"pimCategoryId":810,"categories":[{"id":1,"name":"Thuốc","parentName":null,"slug":"thuoc","level":1,"isActive":false},{"id":729,"name":"Thuốc giảm đau, hạ sốt, kháng viêm","parentName":"Thuốc","slug":"thuoc/thuoc-giam-dau-ha-sot-khang-viem","level":2,"isActive":false},{"id":768,"name":"Thuốc giảm đau hạ sốt","parentName":"Thuốc giảm đau, hạ sốt, kháng viêm","slug":"thuoc/thuoc-giam-dau-ha-sot-khang-viem/thuoc-giam-dau-ha-sot","level":3,"isActive":false}],"prices":[{"measureUnitCode":1,"measureUnitName":"Hộp","isSellDefault":false,"price":252000,"currencySymbol":"đ","isDefault":true,"isInventory":true,"level":1,"productSpecs":"Hộp 15 Vỉ x 12 Viên"},{"measureUnitCode":13,"measureUnitName":"Vỉ","isSellDefault":false,"price":16800,"currencySymbol":"đ","isDefault":true,"isInventory":true,"level":2,"productSpecs":"15 Vỉ x 12 Viên"},{"measureUnitCode":8,"measureUnitName":"Viên","isSellDefault":true,"price":1400,"currencySymbol":"đ","isDefault":true,"isInventory":true,"level":3,"productSpecs":"12 Viên"}],"slug":"thuoc/panadol-extra-do-500mg-180v-sanofi-16965.html","ingredient":[{"id":43957,"ingredientId":12241,"shortDescription":"65mg","name":"Caffeine","isPrimary":false,"slug":"thanh-phan/caffeine"},{"id":43958,"ingredientId":31537,"shortDescription":"500mg","name":"Paracetamol","isPrimary":false,"slug":""}],"webIngredient":"","ingredientFor":"1 viên","registNum":"539100184523","manufactor":"Việt Nam/ Malaysia","dosageForm":"Viên nén","dosage":"<h3><strong>Cách dùng</strong></h3><p>Chỉ dùng đường uống.</p><h3><strong>Liều dùng</strong></h3><p><strong>Người lớn (kể cả người cao tuổi) và trẻ em từ 16 tuổi trở lên:</strong></p><ul><li>Dùng 2 viên/lần, có thể dùng 4 lần trong ngày. Không nên dùng liều lặp lại thường xuyên hơn mỗi 4 giờ.</li><li>Không dùng quá 8 viên trong 24 giờ.</li></ul><p><strong>Trẻ em từ 12 - 15 tuổi:</strong></p><ul><li>Dùng 1 viên/lần, có thể dùng 4 lần trong ngày. Không nên dùng liều lặp lại thường xuyên hơn mỗi 4 giờ. Không dùng quá 4 viên trong 24 giờ.</li></ul><p><strong>Không khuyến nghị dùng Panadol Extra cho trẻ em dưới 12 tuổi.</strong></p><p>Lưu ý: Liều dùng trên chỉ mang tính chất tham khảo. Liều dùng cụ thể tùy thuộc vào thể trạng và mức độ diễn tiến của bệnh. Để có liều dùng phù hợp, bạn cần tham khảo ý kiến bác sĩ hoặc chuyên viên y tế.</p><h3><strong>Làm gì khi dùng quá liều?</strong></h3><p><strong>Paracetamol</strong></p><p><i>Dấu hiệu và triệu chứng</i></p><p>Kinh nghiệm cho thấy việc quá liều paracetamol dẫn đến các dấu hiệu lâm sàng của tổn thương gan thường xảy ra sau 24 giờ đến 48 giờ và đạt đỉnh sau 4 đến 6 ngày.</p><p>Dùng quá liều paracetamol có thể gây suy gan, có thể yêu cầu ghép gan hoặc dẫn đến tử vong. Đã quan sát thấy viêm tụy cấp, thường bị kèm với rối loạn chức năng gan và nhiễm độc gan.</p><p>Các triệu chứng của việc dùng quá liều paracetamol trong 24 giờ đầu tiên là xanh xao, buồn nôn, nôn, chán ăn và <a href=\"https://nhathuoclongchau.com.vn/benh/dau-bung-994.html\">đau bụng</a>. Tổn thương gan có thể rõ ràng sau khi uống 12 đến 48 giờ. Những bất thường về chuyển hóa&nbsp;glucose và toan chuyển hóa có thể xảy ra. Trường hợp ngộ độc nặng, suy gan có thể tiến triển thành bệnh não, xuất huyết, hạ đường huyết, phù não và tử vong.</p><p>Suy thận cấp với hoại tử ống thận cấp, biểu hiện như đau thắt lưng, huyết niệu và protein niệu, có thể tiến triển ngay cả khi không có tổn thương gan nghiêm trọng. Đã có báo cáo về rối loạn nhịp tim và viêm tụy.</p><p><i>Điều trị</i></p><p>Áp dụng các biện pháp kiểm soát y tế ngay khi xảy ra trường hợp quá&nbsp;liều thậm chí khi các triệu chứng của hiện tượng quá liều không xuất hiện.</p><p>Nếu trường hợp quá liều được xác nhận hoặc nghi ngờ, ngay lập tức liên lạc với Trung tâm phòng chống độc để được tư vấn và đưa bệnh nhân đến Trung tâm cấp cứu y tế gần nhất để xử lý và điều trị chuyên môn.</p><p>Nên thực hiện ngay cả khi bệnh nhân không có triệu chứng hoặc dấu hiệu của quá&nbsp;liều do nguy cơ tổn thương gan chậm.</p><p>Trường hợp không có Trung tâm phòng chống độc, hãy đưa bệnh nhân đến Trung tâm cấp cứu y tế gần nhất để xử lý và điều trị chuyên môn.</p><p>Có thể cần sử dụng N-acetylcystein hoặc methionin.</p><p><strong>Caffeine</strong></p><p><i>Dấu hiệu và triệu chứng</i></p><p>Quá liều caffeine có thể gây đau thượng vị, nôn, tăng bài niệu, nhịp tim nhanh, kích thích thần kinh trung ương (mất ngủ, thao thức, kích động, bối rối, hoảng sợ, run, co giật).</p><p>Khi dùng thuốc quá liều, cần chú ý rằng ngoài các triệu chứng xảy ra do quá liều caffeine còn có thể gây ra độc tính nghiêm trọng với gan do quá liều paracetamol.</p><p><i>Điều trị</i></p><p>Không có chất giải độc đặc hiệu nhưng có thể dùng các biện pháp cấp cứu thích hợp như dùng thuốc đối kháng thụ thể beta giao cảm để ngăn chặn độc tính trên tim.</p><h3><strong>Làm gì khi quên 1 liều?</strong></h3><p>Nếu bạn quên một liều <a href=\"https://nhathuoclongchau.com.vn/thuoc\">thuốc</a>, hãy dùng càng sớm càng tốt. Tuy nhiên, nếu gần với liều kế tiếp, hãy bỏ qua liều đã quên và dùng liều kế tiếp vào thời điểm như kế hoạch. Lưu ý rằng không nên dùng gấp đôi liều đã quy định.</p>","usage":"<h3><strong>Chỉ định</strong></h3><p><span style=\"color:#212121;\">Panadol Extra giảm đau và hạ sốt nhẹ với công thức tăng cường tác dụng giảm đau. Thuốc được khuyến cáo để điều trị hầu hết các triệu chứng đau và hạ sốt, ví dụ như đau đầu, kể cả đau nửa đầu, đau lưng, đau răng, </span><a href=\"https://nhathuoclongchau.com.vn/benh/dau-khop-797.html\"><span style=\"color:#212121;\">đau khớp</span></a><span style=\"color:#212121;\"> và đau bụng kinh, giảm các triệu chứng cảm lạnh, cảm cúm và </span><a href=\"https://nhathuoclongchau.com.vn/benh/dau-hong-795.html\"><span style=\"color:#212121;\">đau họng</span></a><span style=\"color:#212121;\">.</span></p><h3><strong>Dược lực học</strong></h3><p><strong>Nhóm tác dụng dược lý: Giảm đau dạng phối hợp.</strong></p><p><strong>Mã ATC: N02B E51.</strong></p><p><i>Cơ chế tác dụng</i></p><p>Chưa có dữ liệu.</p><h3><strong>Dược động học</strong></h3><p>Chưa có dữ liệu.</p>","brand":"Gsk","brandType":null,"adverseEffect":"<p>Khi sử dụng thuốc Panadol Extra, bạn có thể gặp các tác dụng không mong muốn (ADR).</p><p><i>Rất hiếm gặp, ADR &lt; 1/10.000</i></p><p><strong>Paracetamol</strong></p><p>Rối loạn máu và hệ bạch huyết: Giảm tiểu cầu.</p><p>Rối loạn hệ miễn dịch: Phản ứng quá mẫn, phản ứng mẫn cảm trên da bao gồm: Ban đỏ, phù mạch, hội chứng Stevens–Johnson và hội chứng hoại tử da nhiễm độc.</p><p>Rối loạn hệ hô hấp, ngực và trung thất: Co thắt phế quản ở các bệnh nhân nhạy cảm với aspirin và các NSAID khác.</p><p>Rối loạn gan mật: Bất thường gan.</p><p><strong>Caffeine</strong></p><p>Thần kinh trung ương: <a href=\"https://nhathuoclongchau.com.vn/benh/chong-mat-763.html\">Chóng mặt</a>, đau đầu.</p><p>Rối loạn tim: Táo bón.</p><p>Rối loạn tâm thần: Mất ngủ, bồn chồn, lo lắng và khó chịu, kích động.</p><p>Tiêu hóa: <a href=\"https://nhathuoclongchau.com.vn/benh/roi-loan-tieu-hoa-210.html\">Rối loạn tiêu hóa</a>.</p><p>Khi dùng liều khuyến nghị paracetamol-caffeine cùng với chế độ ăn uống có nhiều caffeine, sẽ gây ra các tác dụng phụ do quá liều caffeine như mất ngủ, thao thức, lo lắng, cáu kinh, đau đầu, rối loạn tiêu hóa, hồi hộp.</p><p><i>Hướng dẫn cách xử trí ADR</i></p><p>Khi gặp tác dụng phụ của thuốc, cần ngưng sử dụng và thông báo cho bác sĩ hoặc đến cơ sở y tế gần nhất để được xử trí kịp thời.</p>","specification":"Hộp 15 Vỉ x 12 Viên","indications":[],"brandOrigin":"Anh","producer":"CÔNG TY CỔ PHẦN SANOFI VIỆT NAM/ STERLING DRUG","shortDescription":"<p>Panadol Extra giảm đau và hạ sốt nhẹ với công thức tăng cường tác dụng giảm đau. Thuốc được khuyến cáo để điều trị hầu hết các triệu chứng đau và hạ sốt, ví dụ như đau đầu, kể cả đau nửa đầu, đau lưng, đau răng, đau khớp và đau bụng kinh, giảm các triệu chứng cảm lạnh, cảm cúm và đau họng.</p>","description":"<h3>Giới thiệu thuốc Panadol Extra</h3><ul><li><strong>Chỉ định:</strong> Thuốc <a href=\"https://nhathuoclongchau.com.vn/thuoc/panadol-extra-do-500mg-180v-sanofi-16965.html\">Panadol Extra</a> được chỉ định để giảm đau và hạ sốt nhẹ trong các trường hợp <a href=\"https://nhathuoclongchau.com.vn/benh/nhuc-dau-24.html\">đau đầu</a>, kể cả <a href=\"https://nhathuoclongchau.com.vn/benh/dau-nua-dau-12.html\">đau nửa đầu</a>, đau lưng, đau răng, đau khớp và <a href=\"https://nhathuoclongchau.com.vn/benh/dau-bung-kinh-567.html\">đau bụng kinh</a>, giảm các triệu chứng cảm lạnh, cảm cúm và đau họng.</li><li><strong>Cách dùng:</strong> Thuốc chỉ dùng đường uống.</li><li><strong>Đối tượng sử dụng:</strong> Người cần giảm đau, hạ sốt nhẹ.</li><li><strong>Lưu ý khi sử dụng:</strong> Dùng quá liều paracetamol có thể gây ra suy gan, điều này có thể cần đến việc ghép gan hoặc dẫn đến tử vong. Trên các bệnh nhân đang bị các bệnh về gan, có sự gia tăng nguy cơ gây hại của paracetamol đối với gan. Tham khảo ý kiến bác sĩ trước khi dùng thuốc này cho các bệnh nhân được chẩn đoán là suy gan hoặc suy thận.</li><li><strong>Chống chỉ định:</strong> Bệnh nhân có tiền sử quá mẫn với <a href=\"https://nhathuoclongchau.com.vn/thuoc/paracetamol-stada-500mg-10x10-32980.html\">paracetamol</a>, caffeine hoặc với bất kỳ tá dược nào của thuốc.</li></ul>","prescription":false,"ageUse":"Trên 12 tuổi","objectUse":["Người lớn","Trẻ em"],"color":[],"hair":[],"flavor":[],"skin":[],"spf":[],"warning":["Suy gan thận"],"specialFeatures":[],"displayCode":1,"isNatural":false,"gender":"","warrantyPeriod":"","contraindication":"","productTypes":"","isActive":true,"isPublish":true,"is_point_block":false,"isShowInfo":true,"brandSlug":"thuong-hieu/gsk","badges":[],"isMonopoly":false,"red
