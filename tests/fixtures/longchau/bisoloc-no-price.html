vel":3,"isActive":false}],"prices":[{"measureUnitCode":1,"measureUnitName":"Hộp","isSellDefault":false,"price":null,"currencySymbol":"đ","isDefault":true,"isInventory":true,"level":1,"productSpecs":"Hộp 3 Vỉ x 10 Viên"},{"measureUnitCode":13,"measureUnitName":"Vỉ","isSellDefault":false,"price":null,"currencySymbol":"đ","isDefault":true,"isInventory":true,"level":2,"productSpecs":"3 Vỉ x 10 Viên"},{"measureUnitCode":8,"measureUnitName":"Viên","isSellDefault":true,"price":null,"currencySymbol":"đ","isDefault":true,"isInventory":true,"level":3,"productSpecs":"10 Viên"}],"slug":"thuoc/bisoloc-25mg-4482.html","ingredient":[{"id":44144,"ingredientId":11178,"shortDescription":"2.5mg","name":"Bisoprolol","isPrimary":false,"slug":"thanh-phan/bisoprolol"}],"webIngredient":"","ingredientFor":"1 viên","registNum":"893110505524","manufactor":"Việt Nam","dosageForm":"Viên nén bao phim","dosage":"<h3><strong>Cách dùng</strong></h3>\n\n<p>Nên dùng buổi sáng, có thể uống cùng với thức ăn. Nên uống nguyên viên với nước, không được nhai.</p>\n\n<h3><strong>Liều dùng</strong></h3>\n\n<p><em>Điều trị tăng huyết áp hoặc bệnh mạch vành (cơn đau thắt ngực): </em></p>\n\n<p>Liều đầu tiên thường dùng là 2,5 - 5 mg, một lần mỗi ngày. Liều dùng có thể tăng lên 10 mg ngày 1 lần nếu cần.</p>\n\n<p>Điều trị tăng huyết áp hoặc cơn đau thắt ngực vớt Bisoprolol là điều trị lâu dài. Đặc biệt ở những bệnh nhân bị thiếu máu cơ tim cục bộ, không nên ngừng Bisoprolol đột ngột. Liều dùng nên được giảm dần, tức là sau 1 - 2 tuần.</p>\n\n<p><em>Điều trị suy tim mãn ổn định, bổ sung vào phần điều trị cơ bản:</em></p>\n\n<p>Các điều kiện trước khi điều trị với Bisoprolol: Bệnh nhân bị suy tim mạn ổn định mà không bị suy tim cấp trong 6 tuần trước đó, không thay đổi phương thức điều trị cơ bản trong 2 tuần vừa qua, được điều trị với liều tối ưu với thuốc ức chế men chuyển (hoặc 1 thuốc giãn mạch khác trong trường hợp không dung nạp với thuốc ức chế men chuyển), thuốc lợi tiểu và Glycoside trợ tim nếu cần.</p>\n\n<p>Cảnh báo: Điều trị suy tim mạn ổn định với Bisoprolol phải được khởi đầu bằng giai đoạn chỉnh liều tăng dần theo các bước như sau:</p>\n\n<ul>\n\t<li>\n\t<p>1,25 mg (nửa viên loại 2,5 mg) ngày 1 lần, trong 1 tuần, nếu dung nạp tốt thì tăng liều.</p>\n\t</li>\n\t<li>\n\t<p>2,5 mg ngày 1 lần, trong 1 tuần kế tiếp, nếu dung nạp tốt thì tăng liều.</p>\n\t</li>\n\t<li>\n\t<p>3,75 mg (một viên rưỡi loại 2,5 mg) ngày 1 lần, trong 1 tuần kế tiếp, nếu dung nạp tốt thì tăng liều.</p>\n\t</li>\n\t<li>\n\t<p>5 mg ngày 1 lần, trong 4 tuần kế tiếp, nếu dung nạp tốt thì tăng liều.</p>\n\t</li>\n\t<li>\n\t<p>7,5 mg ngày 1 lần, trong 4 tuần tiếp theo, nếu dung nạp tốt thì tăng liều.</p>\n\t</li>\n\t<li>\n\t<p>10 mg ngày 1 lần cho điều trị duy trì.</p>\n\t</li>\n</ul>\n\n<p>Sau khi khởi đầu điều trị với liều 1,25 mg, bệnh nhân cần được theo dõi trong khoảng 4 giờ (theo dõi chặt chẽ huyết áp, nhịp tim và các dấu hiệu của rối loạn dẫn truyền, các triệu chứng của suy tim nặng hơn).</p>\n\n<p>Liều tối đa được đề nghị là 10 mg/ngày. Nếu cần, có thể giảm dần liều dạng dùng. Có thể ngưng điều trị khi cần thiết và sử dụng lại khi thích hợp. Trong giai đoạn chỉnh liều, nếu có tình trạng suy tim nặng hơn hoặc không dung nạp thuốc, điều cần làm trước tiên là giảm liều bisoprolol, hoặc ngưng dùng ngay nếu cần.</p>\n\n<p>Nhìn chung, điều trị suy tim mạn ổn định với Bisoprolol thường là điều trị lâu dài. Nếu bắt buộc phải ngưng thuốc, nên giảm dần còn nửa liều mỗi tuần.</p>\n\n<p><em>Suy gan hoặc <a href=\"https://nhathuoclongchau.com.vn/benh/suy-than-679.html\">suy thận</a>:</em></p>\n\n<p>Điều trị tăng huyết áp hoặc bệnh mạch vành: Không cần điều chỉnh liều Bisoprolol ở các bệnh nhân có rối loạn chức năng gan hoặc thận mức độ nhẹ hoặc trung bình, ở các bệnh nhân suy thận giai đoạn cuối (độ thanh thải Creatinine &lt; 20 mL/phút) và ở những bệnh nhân suy gan nặng, không nên dùng quá 10 mg Bisoprolol/ngày.</p>\n\n<p>Điều tri suy tim mạn ổn định: Không có thông tin về dược động học của Bisoprolol ở các bệnh nhân suy tim mạn kèm suy gan hay thận. Việc xác định liều cho các trường hợp này cần rất thận trọng.</p>\n\n<p><em>Người già:</em></p>\n\n<p>Thường không cần điều chỉnh liều.</p>\n\n<h3><strong>Làm gì khi quá liều?</strong></h3>\n\n<p>Các triệu chứng thường gặp nhất khi dùng quá liều các thuốc chẹn β là chậm nhịp tim, tụt huyết áp, co thắt phế quản, suy tim cấp và hạ đường huyết.</p>\n\n<p>Nhìn chung, khi xảy ra quá liều, nên ngưng dùng Bisoprolol và bệnh nhân nên được điều trị hỗ trợ và điều trị triệu chứng. Các dữ liệu hạn chế cho thấy Bisoprolol khó thẩm phân được.</p>\n\n<p>Nhịp tim chậm: Tiêm tĩnh mạch Atropine.</p>\n\n<p>Hạ huyết áp: Dùng<a href=\"https://nhathuoclongchau.com.vn/thanh-phan/isoprenaline\"> Isoproterenol</a> hoặc một thuốc chủ vận Alpha - adrenergic.</p>\n\n<p>Block tim (độ 2 hoặc 3): Theo dõi cẩn thận, tiêm truyền Isoproterenol hoặc máy tạo nhịp tim.</p>\n\n<p>Suy tim sung huyết: Dùng Digitalis, thuốc lợi tiểu, thuốc làm tăng lực co cơ, thuốc giãn mạch.</p>\n\n<p>Co thắt phế quản: Dùng một thuốc giãn phế quản như Isoproterenol và/hoặc Aminophylin.</p>\n\n<p>Hạ glucose huyết: Tiêm tĩnh mạch Glucose.</p>\n\n<h3><strong>Làm gì khi quên liều?</strong></h3>\n\n<p>Nếu bạn quên một liều thuốc, hãy uống càng sớm càng tốt. Tuy nhiên, nếu gần với liều kế tiếp, hãy bỏ qua liều đã quên và uống liều kế tiếp vào thời điểm như kế hoạch. Không uống gấp đôi liều đã quy định.</p>","usage":"<h3><strong>Chỉ định</strong></h3>\n\n<p><a href=\"https://nhathuoclongchau.com.vn/thuoc/bisoloc-25mg-4482.html\">Thuốc Bisoloc 2,5 mg</a> chỉ định điều trị suy tim mạn ổn định từ vừa đến nặng cho bệnh nhân giảm chức năng tâm thu thất (phân suất tống máu &lt; 35%, dựa trên siêu âm tim) kết hợp với thuốc ức chế men chuyển và lợi tiểu, và các Glycoside trợ tim nếu cần.</p>\n\n<h3><strong>Dược lực học</strong></h3>\n\n<p><a href=\"https://nhathuoclongchau.com.vn/thanh-phan/bisoprolol\">Bisoprolol</a> là thuốc ức chế chọn lọc trên thụ thể β1 - adrenergic, không có hoạt tính ổn định màng và không có hoạt tính kích thích giao cảm nội tại. Bisoprolol ít có ái lực với thụ thể β2 trên cơ trơn phế quản và thành mạch cũng như lên sự chuyển hóa. Do đó, Bisoprolol ít ảnh hưởng lên sức cản đường dẫn khí và ít có tác động chuyển hóa trung gian qua thụ thể β2.</p>\n\n<h3><strong>Dược động học</strong></h3>\n\n<p>Bisoprolol được hấp thu và đạt sinh khả dụng khoảng 90% sau khi uống. Bisoprolol liên kết với Protein huyết tương khoảng 30%. Thời gian bán thải trong huyết tương từ 10 - 12 giờ, cho hiệu quả suốt 24 giờ sau khi uống 1 liều 1 ngày. Bisoprolol được bài tiết qua 2 đường: 50% thuốc chuyển hóa qua gan thành dạng không có hoạt tính và cuối cùng được thải qua thận, 50% còn lại được thải qua thận ở dạng không đổi. Vì sự đào thải xảy ra ở thận và gan ở cùng mức độ nên không cần điều chỉnh liều cho các bệnh nhânsuy gan hoặc suy thận.</p>","brand":"United","brandType":null,"adverseEffect":"<p>Tác dụng phụ thường gặp của Bisoprolol có thể bao gồm cảm giác lạnh hoặc tê cóng ở chân tay, buồn nôn, nôn, tiêu chảy và táo bón.</p>\n\n<p>Các tác dụng phụ như mệt mỏi, chóng mặt hoặc nhức đầu xảy ra nhất là khi mới bắt đầu điều trị với Bisoprolol, các tác dụng phụ này thường nhẹ và mất đi sau 1 đến 2 tuần điều trị.</p>\n\n<p>Các tác dụng phụ ít gặp bao gồm yếu cơ, vọp bẻ, rối loạn giấc ngủ, trầm cảm, chậm nhịp tim, rối loạn dẫn truyền tim,<a href=\"https://nhathuoclongchau.com.vn/benh/suy-tim-314.html\"> suy tim</a> nặng hơn và hạ huyết áp tư thế đứng. Nếu bệnh nhân đang bị hen phế quản hay bệnh phổi tắc nghẽn mạn tính, Bisoprolol có thể gây co thắt cơ trơn phế quản nhưng ít gặp.</p>\n\n<p>Các tác dụng hiếm gặp bao gồm tổn thương thính giác, viêm mũi dị ứng, viêm gan, rối loạn cương dương, giảm nước mắt, ác mộng, ảo giác, <a href=\"https://nhathuoclongchau.com.vn/benh/ngua-530.html\">ngứa</a>, đỏ bừng mặt, phát ban, tăng men gan.</p>\n\n<p>Xin thông báo cho bác sĩ những tác dụng không mong muốn gặp phải khi dùng thuốc.</p>","specification":"Hộp 3 Vỉ x 10 Viên","indications":[],"brandOrigin":"Việt Nam","producer":"UNITED","shortDescription":"<p>Bisoloc 2,5 mg của nhà sản xuất United (Việt Nam), thành phần chính Bisoprolol fumarate, là thuốc dùng để điều trị điều trị tăng huyết áp và bệnh mạch vành (cơn đau thắt ngực), suy tim mạn ổn định vừa - nặng ở bệnh nhân giảm chức năng tâm thu thất (phân suất tống máu ≤ 35%, dựa trên siêu âm tim) kết hợp ACEI và lợi tiểu, và Glycoside trợ tim nếu cần.</p>","description":"","prescription":true,"ageUse":"","objectUse":[],"color":[],"hair":[],"flavor":[],"skin":[],"spf":[],"warning":["Lái tàu xe","Phụ nữ có thai"],"specialFeatures":[],"displayCode":2,"isNatural":false,"gender":"","warrantyPeriod":"","contraindication":"","productTypes":"","isActive":true,"isPublish":true,"is_point_block":false,"isShowInfo":true,"brandSlug":"thuong-hieu/united","badges":[],"isMonopoly":false,"redirectUrl":"","legalDeclaration":"","officialProductName":"BISOLOC TAB 2.5MG 3X10'S","thumbnail":null,"shortVideoUrl":"","expirationDate":"24 tháng","brandOriginBadges":{"id":268,"attributeName":"Việt Nam","attributeImage":"https://cdn.nhathuoclongchau.com.vn/v1/static/smalls/vn_Vietnam_02c595ff0c.png"},"videoType":"","guideline":null,"isComingSoon":false}}},"page":"/[...slug]","buildId":"7Pz6EWpRFjcC1BHENFnU4"}</script></body></html>
