<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="100%" height="100%">
  <defs>
    <filter id="h-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14532d" flood-opacity="0.14" />
    </filter>
    <linearGradient id="h-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
    <linearGradient id="h-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="h-leaf1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="h-leaf2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Icon group: 160x160 tile at origin -->
  <g transform="translate(0, 0) scale(0.8)">
    <rect x="10" y="10" width="180" height="180" rx="48"
          fill="url(#h-shield)" stroke="rgba(21, 128, 61, 0.16)" stroke-width="2"
          filter="url(#h-shadow)" />
    <path d="
      M 79 38 C 79 32 85 26 91 26 L 109 26 C 115 26 121 32 121 38
      L 121 79 L 162 79 C 168 79 174 85 174 91 L 174 109
      C 174 115 168 121 162 121 L 121 121 L 121 162
      C 121 168 115 174 109 174 L 91 174 C 85 174 79 168 79 162
      L 79 121 L 38 121 C 32 121 26 115 26 109 L 26 91
      C 26 85 32 79 38 79 L 79 79 Z"
      fill="url(#h-cross)" />
    <path d="M 42 142 C 42 142 58 88 108 72 C 138 62 166 66 166 66
             C 166 66 156 102 124 122 C 88 144 42 142 42 142 Z"
      fill="url(#h-leaf1)" opacity="0.95" />
    <path d="M 68 152 C 86 166 118 168 136 152 C 142 146 146 138 148 130
             C 134 140 114 142 98 136 C 82 130 72 142 68 152 Z"
      fill="url(#h-leaf2)" opacity="0.85" />
    <g transform="translate(100, 100) rotate(-45)">
      <rect x="-14" y="-28" width="28" height="56" rx="14"
            fill="#ffffff" stroke="#047857" stroke-width="3" />
      <path d="M -14 0 A 14 14 0 0 1 14 0 L 14 -14 A 14 14 0 0 0 -14 -14 Z"
            fill="url(#h-cross)" />
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#047857" stroke-width="2.5" />
      <path d="M -8 -20 A 8 8 0 0 1 -2 -26 L -2 -6 A 8 8 0 0 1 -8 0 Z"
            fill="#ffffff" opacity="0.4" />
    </g>
    <path d="M 64 128 C 92 108 126 86 156 72"
          fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round" opacity="0.55" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(176, 0)">
    <text x="0" y="74"
          font-family="'Be Vietnam Pro', Inter, system-ui, -apple-system, sans-serif"
          font-size="56" font-weight="800" letter-spacing="-1.2" fill="#14532d">Nhà Thuốc</text>
    <text x="0" y="134"
          font-family="'Be Vietnam Pro', Inter, system-ui, -apple-system, sans-serif"
          font-size="56" font-weight="800" letter-spacing="-1.2" fill="#047857">Sinh Thái</text>
    <rect x="0" y="90" width="200" height="3" rx="1.5" fill="#10b981" />
  </g>
</svg>
